# Builds "PC Remote.exe" and pcremote.apk on every push to main and publishes
# them as a GitHub release. The apps check /releases/latest to update themselves.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r relay/requirements.txt cryptography Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Relay attack suite
        run: python tests/test_relay_attacks.py
      - name: Phone files end to end
        run: python tests/test_phone_cli.py
      - name: Internet through the PC (netproxy)
        run: python tests/test_netproxy.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Phone side of «Интернет через ПК» on the JVM (NetMux + SOCKS5 against the relay)
        run: python tests/test_netmux_jvm.py
      - name: «Проводник» core on the JVM
        run: python tests/test_files_jvm.py
      - name: «Проводник» ↔ PC, zip, search filters, batch rename (JVM against the relay)
        run: python tests/test_pcclient_jvm.py
      - name: Web client smoke test (real browser)
        run: python tests/test_web_smoke.py
      - name: Web client syntax
        run: node -e "new Function(require('fs').readFileSync('web/app.js','utf8')); new Function(require('fs').readFileSync('web/cc_ru.js','utf8')); console.log('js ok')"

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        run: Set-Content -Path VERSION -Value "${{ env.VERSION }}" -NoNewline
      - name: Check the phone CLI parses (PowerShell)
        run: |
          $null = [scriptblock]::Create((Get-Content pcapp/phone_cli/phone.ps1 -Raw))
          Write-Host "phone.ps1 ok"
      - name: Build
        run: |
          pip install -r agent/requirements.txt -r relay/requirements.txt cryptography pystray qrcode dxcam pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name "PC Remote" `
            --add-data "relay;relay" --add-data "agent;agent" --add-data "web;web" --add-data "VERSION;." --add-data "pcapp/phone_cli;pcapp/phone_cli" `
            --hidden-import mss.windows --hidden-import PIL._tkinter_finder --hidden-import pystray._win32 --collect-all winpty --collect-all comtypes --collect-all pycaw --collect-all dxcam `
            pcapp/main.py
          Rename-Item "dist/PC Remote.exe" "PC-Remote.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/PC-Remote.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The signing key lives in repository secrets (Settings -> Secrets -> Actions):
      #   ANDROID_KEYSTORE_B64  - the keystore file, base64
      #   ANDROID_KEYSTORE_PASS - its password
      # Without them a throwaway key is used: the APK installs, but self-update
      # cannot replace an APK signed with a different key.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/release.keystore; echo "release key"; else echo "::warning::ANDROID_KEYSTORE_B64 secret not set, using a temporary key"; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -f /tmp/release.keystore ]; then KS="--keystore /tmp/release.keystore --ks-pass $KS_PASS"; else KS=""; fi
          python3 android/build.py --sdk "$ANDROID_HOME" \
            --version-code ${{ github.run_number }} --version-name "${{ env.VERSION }}" $KS
      - name: The PC's own signer (pcapp/apksign.py) must produce APKs apksigner accepts
        run: |
          pip install cryptography
          python3 -c "
          import sys; sys.path.insert(0, 'pcapp'); from pathlib import Path; import apksign
          k, c = apksign.ensure_key(Path('/tmp/apkkey')); print(apksign.sign(Path('android/out/pcremote.apk'), Path('/tmp/resigned.apk'), k, c))"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/resigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/out/pcremote.apk

  apk-net:
    # «Интернет через ПК»: the second phone app. Its packet engine (hev-socks5-tunnel, MIT)
    # is built from source with the NDK that ships on the runner, at a pinned commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: hev-socks5-tunnel (native)
        run: |
          mkdir -p hev && cd hev
          git clone -q --recursive https://github.com/heiher/hev-socks5-tunnel jni
          (cd jni && git checkout -q 2cdc169a248ced7097a7931aea5bf81540dc7759 && git submodule update -q --init --recursive)
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/ndk-build" -j4 APP_ABI="arm64-v8a armeabi-v7a" APP_PLATFORM=android-24 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_OPTIM=release APP_CFLAGS="-O3" NDK_TOOLCHAIN_VERSION=clang > /dev/null
          ls -la libs/*/
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/release.keystore; echo "release key"; else echo "::warning::ANDROID_KEYSTORE_B64 secret not set, using a temporary key"; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -f /tmp/release.keystore ]; then KS="--keystore /tmp/release.keystore --ks-pass $KS_PASS"; else KS=""; fi
          python3 android/build.py --sdk "$ANDROID_HOME" --project android-net --out-name pcremote-net.apk --native-libs hev/libs \
            --extra-src android/src/ru/pcremote/Pinned.java --extra-src android/src/ru/pcremote/Pairing.java \
            --extra-src android/src/ru/pcremote/WsClient.java --extra-src android/src/ru/pcremote/Updater.java --extra-src android/src/ru/pcremote/Paths.java \
            --version-code ${{ github.run_number }} --version-name "${{ env.VERSION }}" $KS
      - uses: actions/upload-artifact@v4
        with:
          name: apk-net
          path: android/out/pcremote-net.apk

  apk-files:
    # «Проводник»: the file manager. Pure Java, no native code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/release.keystore; echo "release key"; else echo "::warning::ANDROID_KEYSTORE_B64 secret not set, using a temporary key"; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -f /tmp/release.keystore ]; then KS="--keystore /tmp/release.keystore --ks-pass $KS_PASS"; else KS=""; fi
          python3 android/build.py --sdk "$ANDROID_HOME" --project android-files --out-name pcremote-files.apk \
            --extra-src android/src/ru/pcremote/Pairing.java --extra-src android/src/ru/pcremote/Updater.java --extra-src android/src/ru/pcremote/Pinned.java --extra-src android/src/ru/pcremote/Paths.java \
            --version-code ${{ github.run_number }} --version-name "${{ env.VERSION }}" $KS
      - uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: android/out/pcremote-files.apk

  release:
    needs: [test, exe, apk, apk-net, apk-files]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Checksums
        run: |
          (cd out/exe && sha256sum PC-Remote.exe) > out/SHA256SUMS
          (cd out/apk && sha256sum pcremote.apk) >> out/SHA256SUMS
          (cd out/apk-net && sha256sum pcremote-net.apk) >> out/SHA256SUMS
          (cd out/apk-files && sha256sum pcremote-files.apk) >> out/SHA256SUMS
          cat out/SHA256SUMS
      - name: Release notes
        run: |
          echo "Сборка ${{ env.VERSION }} из ${{ github.sha }}" > notes.md
          echo "" >> notes.md
          echo "${{ github.event.head_commit.message }}" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PC Remote ${{ env.VERSION }}
          body_path: notes.md
          files: |
            out/exe/PC-Remote.exe
            out/apk/pcremote.apk
            out/apk-net/pcremote-net.apk
            out/apk-files/pcremote-files.apk
            out/SHA256SUMS
